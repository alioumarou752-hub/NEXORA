<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion — NEXORA</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;

            background:
                radial-gradient(
                    circle at top,
                    rgba(99, 91, 255, 0.12),
                    transparent 45%
                ),
                #f7f8fc;
        }


        .login-card {
            width: 100%;
            max-width: 460px;

            background: #ffffff;

            padding: 42px 34px;

            border-radius: 24px;

            border: 1px solid #e8eaf0;

            box-shadow:
                0 20px 60px rgba(40, 40, 80, 0.10);
        }


        .login-logo {
            text-align: center;

            font-size: 30px;

            font-weight: 800;

            color: #635bff;

            letter-spacing: -1px;

            margin-bottom: 25px;
        }


        .login-card h1 {
            text-align: center;

            font-size: 30px;

            margin-bottom: 10px;
        }


        .login-subtitle {
            text-align: center;

            color: #667085;

            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            font-weight: 700;

            margin-bottom: 8px;
        }


        .form-group input {
            width: 100%;

            padding: 15px;

            border: 1px solid #d9d9e3;

            border-radius: 11px;

            font-size: 16px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .form-group input:focus {

            border-color: #635bff;

            box-shadow:
                0 0 0 4px
                rgba(99, 91, 255, 0.10);
        }


        .login-button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 11px;

            background: #635bff;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .login-button:hover {

            background: #5148e8;

            transform: translateY(-2px);
        }


        #message {

            margin-top: 18px;

            text-align: center;

            font-size: 14px;

            min-height: 20px;
        }


        .register {

            text-align: center;

            margin-top: 25px;

            color: #667085;
        }


        .register a {

            color: #635bff;

            font-weight: 700;

            text-decoration: none;
        }


        .back {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #667085;

            text-decoration: none;
        }


        @media (max-width: 600px) {

            .login-page {
                padding: 20px 15px;
            }

            .login-card {
                padding: 32px 22px;

                border-radius: 20px;
            }

            .login-card h1 {
                font-size: 27px;
            }

        }

    </style>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

</head>


<body>


<div class="login-page">


    <div class="login-card">


        <div class="login-logo">
            NEXORA
        </div>


        <h1>
            Bon retour 👋
        </h1>


        <p class="login-subtitle">
            Connectez-vous à votre espace NEXORA.
        </p>


        <form id="connexionForm">


            <div class="form-group">

                <label for="email">
                    Adresse e-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="exemple@email.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Votre mot de passe"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Se connecter
            </button>


        </form>


        <p id="message"></p>


        <p class="register">

            Vous n'avez pas encore de compte ?

            <a href="inscription.html">
                Créer un compte
            </a>

        </p>


        <a href="index.html" class="back">
            ← Retour à NEXORA
        </a>


    </div>

</div>


<script>

const SUPABASE_URL =
"https://klvgazjmrxflcrfzauao.supabase.co";


const SUPABASE_KEY =
"sb_publishable_-3yupW48WBr95MTiiXAfaA_EwL2Zohs";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const form =
document.getElementById("connexionForm");


const message =
document.getElementById("message");


const loginButton =
document.getElementById("loginButton");


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        message.textContent =
            "Connexion en cours...";


        loginButton.disabled = true;

        loginButton.textContent =
            "Connexion...";


        const { error } =
            await supabaseClient.auth
            .signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            message.textContent =
                "Erreur : " +
                error.message;

            loginButton.disabled = false;

            loginButton.textContent =
                "Se connecter";

            return;
        }


        message.textContent =
            "Connexion réussie !";


        window.location.href =
            "dashboard.html";

    }
);

</script>


</body>

</html>
