}

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================
   CONTENEUR
========================= */

const projectContent =
    document.getElementById(

let utilisateurActuel = null;

let objectifEnModification = null;
let tacheEnModification = null;


/* =========================
   ÉCHAPPER HTML
========================= */

function echapperHTML(texte) {

    return String(texte)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =========================
   CHARGER LE PROJET
========================= */

async function chargerProjet() {

    /* Utilisateur */

    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();


    if (userError || !user) {

        window.location.href =
            "connexion.html";

        return;

    }
utilisateurActuel = user;

    /* ID dans l'URL */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const projetId =
        params.get("id");


    if (!projetId) {

        afficherErreur(
            "Aucun projet n'a été sélectionné."
        );

        return;

    }


    /* Récupérer le projet */

    const {
        data: projet,
        error
    } = await supabaseClient
        .from("projets")
        .select("*")
        .eq("id", projetId)
        .eq("user_id", user.id)
        .single();


    if (error || !projet) {

        console.error(error);

        afficherErreur(
            "Projet introuvable ou inaccessible."
        );

        return;

    }

projetActuel = projet;

afficherProjet(projet);

chargerObjectifs();

chargerTaches();
async function chargerTaches() {

    const tachesContainer =
        document.getElementById(
            "tachesContainer"
        );

    if (!tachesContainer) {
        return;
    }

    const {
        data: taches,
        error
    } = await supabaseClient
        .from("taches")
        .select("*")
        .eq(
            "projet_id",
            projetActuel.id
        )
        .eq(
            "user_id",
            utilisateurActuel.id
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        tachesContainer.innerHTML = `
            <div class="tache-message">
                ❌ Impossible de charger les tâches.
            </div>
        `;

        return;
    }


    if (!taches || taches.length === 0) {

        tachesContainer.innerHTML = `
            <div class="tache-message">
                Aucune tâche pour le moment.
            </div>
        `;

        return;
    }


    tachesContainer.innerHTML =
        taches
            .map(
                tache => `

                    <div class="tache-card">

                        <h3>
                            ${echapperHTML(
                                tache.titre
                            )}
                        </h3>


                        <p>
                            ${echapperHTML(
                                tache.description ||
                                ""
                            )}
                        </p>


                        <div class="tache-info">

                            <span class="tache-statut">
                                ${echapperHTML(
                                    tache.statut
                                )}
                            </span>


                            ${
                                tache.echeance
                                ?
                                `
                                <span class="tache-echeance">
                                    📅 ${echapperHTML(
                                        tache.echeance
                                    )}
                                </span>
                                `
                                :
                                `
                                <span class="tache-echeance">
                                    📅 Aucune échéance
                                </span>
                                `
                            }

                        </div>


                        <div class="tache-card-actions">

                            <button
                                type="button"
                                class="btn-edit-tache"
                                onclick="modifierTache('${tache.id}')"
                            >
                                ✏️ Modifier
                            </button>


                            <button
                                type="button"
                                class="btn-delete-tache"
                                onclick="supprimerTache('${tache.id}')"
                            >
                                🗑️ Supprimer
                            </button>

                        </div>

                    </div>

                `
            )
            .join("");
}
}

/* =====================================================
   OBJECTIFS
===================================================== */

async function chargerObjectifs() {

    const objectifsContainer =
        document.getElementById(
            "objectifsContainer"
        )

    if (!objectifsContainer) {
        return;
    }


    const {
        data: objectifs,
        error
    } = await supabaseClient
        .from("objectifs")
        .select("*")
        .eq(
            "projet_id",
            projetActuel.id
        )
        .eq(
            "user_id",
            utilisateurActuel.id
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        objectifsContainer.innerHTML = `
            <div class="objectif-message">
                ❌ Impossible de charger les objectifs.
            </div>
        `;

        return;

    }


    if (!objectifs || objectifs.length === 0) {

        objectifsContainer.innerHTML = `
            <div class="objectif-message">
                Aucun objectif pour le moment.
            </div>
        `;

        return;

    }


    objectifsContainer.innerHTML =
        objectifs
            .map(
                objectif => `

                    <div class="objectif-card">

                        <h3>
                            ${echapperHTML(
                                objectif.titre
                            )}
                        </h3>


                        <p>
                            ${echapperHTML(
                                objectif.description ||
                                ""
                            )}
                        </p>


                        <span class="objectif-statut">
                            ${echapperHTML(
                                objectif.statut
                            )}
                        </span>


                        <div class="objectif-card-actions">

                            <button
                                type="button"
                                class="btn-edit-objectif"
                                onclick="modifierObjectif('${objectif.id}')"
                            >
                                ✏️ Modifier
                            </button>


                            <button
                                type="button"
                                class="btn-delete-objectif"
                                onclick="supprimerObjectif('${objectif.id}')"
                            >
                                🗑️ Supprimer
                            </button>

                        </div>

                    </div>

                `
            )
            .join("");

}


/* =========================
   ENREGISTRER OBJECTIF
========================= */

async function enregistrerObjectif() {

    const titre =
        document
            .getElementById(
                "titreObjectif"
            )
            .value
            .trim();


    const description =
        document
            .getElementById(
                "descriptionObjectif"
            )
            .value
            .trim();


    const statut =
        document
            .getElementById(
                "statutObjectif"
            )
            .value;


    const message =
        document.getElementById(
            "objectifMessage"
        );


    if (!titre) {

        message.textContent =
            "⚠️ Le titre de l'objectif est obligatoire.";

        return;

    }


    message.textContent =
        "Enregistrement...";


    if (objectifEnModification) {

        const {
            error
        } = await supabaseClient
            .from("objectifs")
            .update({

                titre:
                    titre,

                description:
                    description,

                statut:
                    statut

            })
            .eq(
                "id",
                objectifEnModification
            )
            .eq(
                "user_id",
                utilisateurActuel.id
            );


        if (error) {

            console.error(error);

            message.textContent =
                "❌ Impossible de modifier l'objectif.";

            return;

        }


        annulerModificationObjectif();

        await chargerObjectifs();

        message.textContent =
            "✅ Objectif modifié.";

        return;

    }


    const {
        error
    } = await supabaseClient
        .from("objectifs")
        .insert({

            projet_id:
                projetActuel.id,

            user_id:
                utilisateurActuel.id,

            titre:
                titre,

            description:
                description,

            statut:
                statut

        });


    if (error) {

        console.error(error);

        message.textContent =
            "❌ Impossible de créer l'objectif.";

        return;

    }


    document
        .getElementById(
            "titreObjectif"
        )
        .value = "";


    document
        .getElementById(
            "descriptionObjectif"
        )
        .value = "";


    document
        .getElementById(
            "statutObjectif"
        )
        .value = "à faire";


    message.textContent =
        "✅ Objectif ajouté.";


    await chargerObjectifs();

}


/* =========================
   MODIFIER OBJECTIF
========================= */

async function modifierObjectif(id) {

    const {
        data: objectif,
        error
    } = await supabaseClient
        .from("objectifs")
        .select("*")
        .eq(
            "id",
            id
        )
        .eq(
            "user_id",
            utilisateurActuel.id
        )
        .single();


    if (error || !objectif) {

        alert(
            "Impossible de récupérer cet objectif."
        );

        return;

    }


    document
        .getElementById(
            "titreObjectif"
        )
        .value =
        objectif.titre || "";


    document
        .getElementById(
            "descriptionObjectif"
        )
        .value =
        objectif.description || "";


    document
        .getElementById(
            "statutObjectif"
        )
        .value =
        objectif.statut || "à faire";


    objectifEnModification =
        id;
document
    .getElementById(
        "objectifFormTitre"
    )
    .scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

    document
        .getElementById(
            "objectifFormTitre"
        )
        .textContent =
        "✏️ Modifier l'objectif";


    document
        .querySelector(
            ".objectif-actions button"
        )
        .textContent =
        "Enregistrer les modifications";


    document
        .getElementById(
            "annulerModificationObjectifBtn"
        )
        .style.display =
        "inline-block";

}


/* =========================
   ANNULER MODIFICATION
========================= */

function annulerModificationObjectif() {

    objectifEnModification =
        null;


    const titre =
        document.getElementById(
            "titreObjectif"
        );


    const description =
        document.getElementById(
            "descriptionObjectif"
        );


    const statut =
        document.getElementById(
            "statutObjectif"
        );


    const bouton =
        document.querySelector(
            ".objectif-actions button"
        );


    const annuler =
        document.getElementById(
            "annulerModificationObjectifBtn"
        );


    const formTitre =
        document.getElementById(
            "objectifFormTitre"
        );


    if (titre) {
        titre.value = "";
    }


    if (description) {
        description.value = "";
    }


    if (statut) {
        statut.value = "à faire";
    }


    if (bouton) {

        bouton.textContent =
            "Ajouter l'objectif";

    }


    if (annuler) {

        annuler.style.display =
            "none";

    }


    if (formTitre) {

        formTitre.textContent =
            "➕ Ajouter un objectif";

    }

}


/* =========================
   SUPPRIMER OBJECTIF
========================= */

async function supprimerObjectif(id) {

    const confirmation =
        confirm(
            "Voulez-vous vraiment supprimer cet objectif ?"
        );


    if (!confirmation) {
        return;
    }


    const {
        error
    } = await supabaseClient
        .from("objectifs")
        .delete()
        .eq(
            "id",
            id
        )
        .eq(
            "user_id",
            utilisateurActuel.id
        );


    if (error) {

        console.error(error);

        alert(
            "Impossible de supprimer l'objectif."
        );

        return;

    }


    await chargerObjectifs();

  }
